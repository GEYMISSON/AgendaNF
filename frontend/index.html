<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda NF</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <!-- ========================= -->
        <!-- SIDEBAR -->
        <!-- ========================= -->

        <aside class="sidebar">

            <div class="logo">

                <h2>Agenda NF</h2>

            </div>

            <nav>

                <ul>

                    <li class="active">
                        <a href="#">
                            <i class="fa-solid fa-chart-line"></i>
                            Dashboard
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-calendar-days"></i>
                            Agendamentos
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-building"></i>
                            Fornecedores
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-truck"></i>
                            Transportadoras
                        </a>
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- ========================= -->
        <!-- CONTEÚDO -->
        <!-- ========================= -->

        <main class="content">

            <header class="topbar">

                <h1>Agendamento de Notas</h1>

                <button id="btnNovo">

                    <i class="fa-solid fa-plus"></i>

                    Novo

                </button>

            </header>

            <!-- Pesquisa -->

            <section class="search-area">

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar nota, fornecedor ou transportadora">

            </section>

            <!-- Tabela -->

            <section class="table-area">

                <table>

                    <thead>

                        <tr>

                            <th width="18%">Data</th>

                            <th width="18%">Nota Fiscal</th>

                            <th>Fornecedor</th>

                            <th width="15%">Volumes</th>

                            <th width="20%">Transportadora</th>

                        </tr>

                    </thead>

                    <tbody id="agendaTabela">

                        <!--
                            O JavaScript criará toda a tabela.
                        -->

                    </tbody>

                </table>

            </section>

        </main>

    </div>

    <!-- JavaScript -->

    <script type="module" src="js/app.js"></script>

</body>

</html>
