<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda NF</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- MENU -->
        <aside class="sidebar">

            <div class="logo">
                <h2>Agenda NF</h2>
            </div>

            <nav>

                <a href="#" class="active">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>

                <a href="#">
                    <i class="fa-solid fa-calendar-days"></i>
                    Agendamentos
                </a>

                <a href="#">
                    <i class="fa-solid fa-building"></i>
                    Fornecedores
                </a>

                <a href="#">
                    <i class="fa-solid fa-truck"></i>
                    Transportadoras
                </a>

            </nav>

        </aside>

        <!-- CONTEÚDO -->
        <main class="content">

            <!-- TOPO -->
            <header class="topbar">

                <h1>Agendamento de Notas</h1>

                <button id="btnNovo">
                    <i class="fa-solid fa-plus"></i>
                    Novo
                </button>

            </header>

            <!-- PESQUISA -->
            <section class="search-area">

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar nota, fornecedor ou transportadora">

            </section>

            <!-- TABELA -->
            <section class="table-area">

                <table>

                    <thead>

                        <tr>

                            <th>Data</th>
                            <th>Nota Fiscal</th>
                            <th>Fornecedor</th>
                            <th>Transportadora</th>
                            <th>Status</th>
                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody id="agendaBody">

                        <!-- JavaScript renderiza aqui -->

                    </tbody>

                </table>

            </section>

        </main>

    </div>

    <script type="module" src="js/app.js"></script>

</body>
</html>
