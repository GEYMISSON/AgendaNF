<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda NF</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/print.css" media="print">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- ===========================
         MENU LATERAL
    ============================ -->

    <aside class="sidebar">

        <div class="logo">

            <h2>Agenda NF</h2>

        </div>

        <nav>

            <ul>

                <li class="active">

                    <a href="index.html">

                        <i class="fa-solid fa-chart-line"></i>

                        Dashboard

                    </a>

                </li>

                <li>

                    <a href="agendamentos.html">

                        <i class="fa-solid fa-calendar-days"></i>

                        Agendamentos

                    </a>

                </li>

                <li>

                    <a href="fornecedores.html">

                        <i class="fa-solid fa-building"></i>

                        Fornecedores

                    </a>

                </li>

                <li>

                    <a href="transportadoras.html">

                        <i class="fa-solid fa-truck"></i>

                        Transportadoras

                    </a>

                </li>

            </ul>

        </nav>

    </aside>

    <!-- ===========================
          CONTEÚDO
    ============================ -->

    <main class="content">

        <!-- CABEÇALHO -->

        <header class="topbar">

            <div>

                <h1>Dashboard</h1>

                <span class="subtitulo">

                    Consulta de Agendamentos

                </span>

            </div>

        </header>

        <!-- CARDS -->

        <section class="cards">

            <div class="card">

                <i class="fa-solid fa-file-invoice"></i>

                <div>

                    <span>Total NF</span>

                    <h2 id="cardNF">0</h2>

                </div>

            </div>

            <div class="card">

                <i class="fa-solid fa-boxes-stacked"></i>

                <div>

                    <span>Volumes</span>

                    <h2 id="cardVolumes">0</h2>

                </div>

            </div>

            <div class="card">

                <i class="fa-solid fa-building"></i>

                <div>

                    <span>Fornecedores</span>

                    <h2 id="cardFornecedor">0</h2>

                </div>

            </div>

            <div class="card">

                <i class="fa-solid fa-truck-fast"></i>

                <div>

                    <span>Transportadoras</span>

                    <h2 id="cardTransportadora">0</h2>

                </div>

            </div>

        </section>

        <!-- FILTRO -->

        <section class="filtro">

            <div class="campo">

                <label>Data Inicial</label>

                <input type="date" id="dataInicial">

            </div>

            <div class="campo">

                <label>Data Final</label>

                <input type="date" id="dataFinal">

            </div>

            <div class="botoes">

                <button id="btnPesquisar">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    Pesquisar

                </button>

                <button id="btnLimpar">

                    <i class="fa-solid fa-broom"></i>

                    Limpar

                </button>

                <button id="btnImprimir">

                    <i class="fa-solid fa-print"></i>

                    Imprimir

                </button>

            </div>

        </section>

        <!-- TABELA -->

        <section class="table-area">

            <table>

                <thead>

                    <tr>

                        <th>Data Agendamento</th>

                        <th>Nota Fiscal</th>

                        <th>Fornecedor</th>

                        <th>Volumes</th>

                        <th>Transportadora</th>

                    </tr>

                </thead>

                <tbody id="agendaTabela">

                </tbody>

            </table>

        </section>

    </main>

</div>

<script type="module" src="js/app.js"></script>

</body>

</html>
